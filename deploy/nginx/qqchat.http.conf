# Temporary HTTP-only configuration used while obtaining the first certificate.
server {
    listen 80;
    listen [::]:80;
    server_name qqchat.example.com;

    root /home/ubuntu/webApp;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
