server {
    listen 80;
    listen [::]:80;
    server_name qqchat.example.com;

    root /home/ubuntu/webApp;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name qqchat.example.com;

    ssl_certificate /etc/letsencrypt/live/qqchat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qqchat.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 40m;

    # QQ Open Platform callback. The container port is bound to 127.0.0.1 only.
    location = /qq/webhook {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3458;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Authenticated DashScope native image-edit adapter.
    location = /v1/image-edits {
        client_max_body_size 40m;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    # Authenticated voice synthesis; response is QQ-compatible SILK audio.
    location = /v1/voice-speech {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    # Unguessable one-time reference URL used only while DashScope enrolls the
    # voice. The adapter returns 404 permanently after the Voice ID is cached.
    location ^~ /v1/voice-reference/ {
        access_log off;
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/(v1|v1beta|messages|chat/completions|responses|interactions|mcp)(/|$) {
        proxy_pass http://127.0.0.1:3458;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    location / {
        return 404;
    }
}
