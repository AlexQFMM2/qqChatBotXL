services:
  qqchat-bot:
    image: ${QQCHAT_IMAGE:-qqchat-local:dev}
    build:
      context: ${QQCHAT_BUILD_CONTEXT:-.}
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-mirror.ccs.tencentyun.com/library/python:3.12-slim}
    container_name: qqchat-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MEMORY_DIR: ${MEMORY_DIR:-}
      MEMORY_IDENTITIES: /app/identity/identities.json
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./data:/app/data
      - ./workspace:/workspace
      - ${QQCHAT_PERSONA:-./persona.md}:/app/persona.md:ro
      - ./shared-memory:/app/shared-memory
      - ./memory-identity:/app/identity:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    mem_limit: 512m
    pids_limit: 100
    init: true
    depends_on:
      searxng:
        condition: service_healthy
    networks:
      - default
      - ai-tools
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 容器端口只绑定环回地址，公网仅能通过 Nginx 的精确 Webhook 路径访问。
    # 不挂载宿主机目录、SSH 凭证或 Docker Socket，Agent 只能看到专用工作区。

  wxchat-bot:
    profiles: [wechat]
    image: ${QQCHAT_IMAGE:-qqchat-local:dev}
    container_name: wxchat-bot
    command: [python, -m, app.wechat.chat, --state-dir, /app/data]
    restart: unless-stopped
    stop_grace_period: 210s
    env_file:
      - path: .wechat-server.env
        format: raw
    environment:
      MEMORY_DIR: /app/shared-memory
      MEMORY_IDENTITIES: /app/identity/identities.json
      MEMORY_MAINTAINER: 'true'
      TASK_QUEUE_WORKERS: '1'
    volumes:
      - ./wechat-data:/app/data
      - ./shared-memory:/app/shared-memory
      - ./memory-identity:/app/identity:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    mem_limit: 512m
    pids_limit: 100
    init: true
    networks: [default, ai-tools]
    healthcheck:
      test: [CMD, python, -m, app.wechat.health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    container_name: qqchat-searxng
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    mem_limit: 384m
    pids_limit: 80
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  qwen-image-adapter:
    build:
      context: ./image_adapter
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-mirror.ccs.tencentyun.com/library/python:3.12-slim}
    container_name: qwen-image-adapter
    restart: unless-stopped
    env_file:
      - .image-adapter.env
    ports:
      - "127.0.0.1:18081:8081"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    mem_limit: 192m
    pids_limit: 50
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qwen-voice-adapter:
    build:
      context: ./voice_adapter
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-mirror.ccs.tencentyun.com/library/python:3.12-slim}
    container_name: qwen-voice-adapter
    restart: unless-stopped
    # Reuse the existing isolated DashScope/client credentials. They are never
    # mounted into the bot container.
    env_file:
      - .image-adapter.env
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://qqchat.example.com}
      VOICE_MODEL: ${VOICE_MODEL:-qwen3-tts-vc-2026-01-22}
      VOICE_PREFIX: shirley
      VOICE_REFERENCE_PATH: /adapter/reference.wav
      VOICE_STATE_PATH: /data/voice_id.txt
      MAX_TEXT_CHARS: ${VOICE_MAX_CHARS:-240}
      MAX_AUDIO_MB: ${VOICE_MAX_MB:-8}
    ports:
      - "127.0.0.1:18082:8082"
    volumes:
      - ./data/voice-adapter:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    mem_limit: 320m
    pids_limit: 80
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ai-tools:
    external: true
    name: ai-tools
